<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="VocabDir — Look up any English word to instantly see its meaning, example sentences, and synonyms. Free, fast, and beautiful.">
    <title>VocabDir — Your Vocabulary Directory</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="container">
        <!-- Header / Hero -->
        <header class="hero">
            <h1 class="logo">
                <span class="logo-icon">📖</span>
                Vocab<span class="logo-accent">Dir</span>
            </h1>
            <p class="tagline">A purposeful service for discovering vocabulary.</p>
        </header>

        <!-- Search Section -->
        <section class="search-section" aria-label="Word search">
            <form id="search-form" class="search-box" autocomplete="off">
                <div class="search-input-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" class="search-input" placeholder="Type any English word…"
                        aria-label="Search for a word" required>
                    <button type="submit" id="search-btn" class="search-btn" aria-label="Search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>
            </form>
        </section>

        <!-- Loading Spinner -->
        <div id="loader" class="loader hidden">
            <div class="spinner"></div>
            <p>Looking it up…</p>
        </div>

        <!-- Error Message -->
        <div id="error" class="error-card hidden">
            <span class="error-emoji">😕</span>
            <h2 id="error-title">Word not found</h2>
            <p id="error-message">We couldn't find a definition for that word. Please check the spelling and try again.
            </p>
        </div>

        <!-- Results -->
        <section id="results" class="results hidden" aria-label="Word results">
            <!-- Word Header -->
            <div class="word-header">
                <div class="word-title-row">
                    <h2 id="result-word" class="result-word"></h2>
                    <button id="audio-btn" class="audio-btn hidden" aria-label="Play pronunciation">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                    </button>
                </div>
                <p id="result-phonetic" class="result-phonetic"></p>
            </div>

            <!-- Meanings Container -->
            <div id="meanings-container" class="meanings-container"></div>

            <!-- Synonyms Section -->
            <div id="synonyms-section" class="synonyms-section hidden">
                <h3 class="section-label">Synonyms</h3>
                <div id="synonyms-list" class="synonyms-list"></div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Built by<a href="https://github.com/vedbulsara04" target="_blank" rel="noopener noreferrer">
                    Ved Bulsara 🧑🏻‍💻</a></p>
        </footer>
    </main>

    <audio id="pronunciation-audio" preload="none"></audio>
    <script src="script.js"></script>
</body>

</html>
